name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,test]"

    - name: Lint with ruff
      run: |
        ruff check .

    - name: Format check with ruff
      run: |
        ruff format --check .

    - name: Test with pytest
      run: |
        pytest --cov=resumable_upload --cov-report=xml --cov-report=term -k "not test_flask and not test_fastapi and not test_django"

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

    - name: Test Flask integration
      run: |
        pytest tests/test_flask_integration.py -v --tb=short

    - name: Test FastAPI integration
      run: |
        pytest tests/test_fastapi_integration.py -v --tb=short

    - name: Test Django integration
      run: |
        pytest tests/test_django_integration.py -v --tb=short

  test-cloud:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,test,s3]"
        pip install moto[s3]

    - name: Test S3 storage backend
      run: |
        pytest tests/test_storage_s3.py -v --tb=short

  interop:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,test]"
        pip install tuspy

    - name: Provision tus-js-client
      run: npm install --ignore-scripts --silent
      working-directory: tests/interop

    - name: Provision tusd
      run: echo "TUSD_BIN=$(sh tests/interop/fetch_tusd.sh)" >> "$GITHUB_ENV"

    - name: Run interop lanes
      run: pytest tests/test_interop.py -v -rs

  lint-types:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Type check with ty
      run: |
        ty check resumable_upload/
